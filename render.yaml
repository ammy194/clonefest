services:
  - type: web
    name: vaultdrop-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaultdrop-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://vaultdrop-frontend.vercel.app,http://localhost:5173"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.10.0"

databases:
  - name: vaultdrop-db
    plan: free
    databaseName: vaultdrop
    user: vaultdrop
